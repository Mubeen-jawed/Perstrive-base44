# nginx site for the Perstrive dashboard. Installed by setup-server.sh.
# certbot adds the HTTPS (443) block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # "Sync Now" pulls 30 days for every account and can take a while.
        proxy_read_timeout 300s;
    }
}
